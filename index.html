<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第二次世界大戰 3D 戰情室</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11100d;
      --ink: #f4ead7;
      --muted: #b8ad9a;
      --panel: rgba(24, 22, 18, .82);
      --panel-strong: rgba(39, 34, 27, .94);
      --line: rgba(244, 234, 215, .18);
      --gold: #d6b15e;
      --blue: #3ca7ff;
      --red: #ff4e42;
      --green: #58d47b;
      --sea: #15384c;
      --land: #50644c;
      --shadow: 0 18px 50px rgba(0, 0, 0, .38);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
      letter-spacing: 0;
    }

    body {
      min-width: 320px;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(circle at 28% 18%, rgba(214, 177, 94, .14), transparent 34%),
        linear-gradient(145deg, #17120f 0%, #0d1717 52%, #1d1711 100%);
    }

    #theater {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #theater:active {
      cursor: grabbing;
    }

    #labelLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .scene-label {
      position: absolute;
      transform: translate(-50%, -100%);
      min-width: max-content;
      padding: 4px 7px;
      border: 1px solid rgba(244, 234, 215, .22);
      border-radius: 6px;
      background: rgba(15, 15, 12, .76);
      color: #fff7e7;
      font-size: 12px;
      line-height: 1.3;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
      box-shadow: 0 8px 18px rgba(0, 0, 0, .24);
      white-space: nowrap;
      transition: opacity .18s ease, transform .18s ease;
    }

    .scene-label.city {
      background: rgba(30, 34, 27, .76);
      color: #eee2c8;
      border-color: rgba(214, 177, 94, .28);
    }

    .scene-label.map-country {
      padding: 3px 7px;
      background: rgba(8, 12, 13, .66);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .scene-label.map-country.allied {
      border-color: rgba(60, 167, 255, .5);
      color: #bfe7ff;
    }

    .scene-label.map-country.axis {
      border-color: rgba(255, 78, 66, .5);
      color: #ffc1bc;
    }

    .scene-label.map-country.neutral {
      border-color: rgba(88, 212, 123, .5);
      color: #c7ffd5;
    }

    .scene-label.unit-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: rgba(14, 13, 11, .82);
      font-weight: 700;
    }

    .mini-flag {
      position: relative;
      width: 30px;
      height: 18px;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .65);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .22);
      background: #777;
    }

    .mini-flag.usa {
      background: repeating-linear-gradient(to bottom, #b52234 0 2px, #fff 2px 4px);
    }

    .mini-flag.usa:before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 13px;
      height: 10px;
      background: #23406f;
    }

    .mini-flag.uk {
      background:
        linear-gradient(32deg, transparent 42%, #fff 42% 48%, #c8102e 48% 54%, #fff 54% 60%, transparent 60%),
        linear-gradient(148deg, transparent 42%, #fff 42% 48%, #c8102e 48% 54%, #fff 54% 60%, transparent 60%),
        linear-gradient(to right, transparent 39%, #fff 39% 45%, #c8102e 45% 55%, #fff 55% 61%, transparent 61%),
        linear-gradient(to bottom, transparent 35%, #fff 35% 43%, #c8102e 43% 57%, #fff 57% 65%, transparent 65%),
        #012169;
    }

    .mini-flag.ussr {
      background: #c81925;
    }

    .mini-flag.ussr:before {
      content: "★";
      position: absolute;
      left: 3px;
      top: -3px;
      color: #ffd23f;
      font-size: 12px;
    }

    .mini-flag.china {
      background: #de2910;
    }

    .mini-flag.china:before {
      content: "✺";
      position: absolute;
      left: 0;
      top: 0;
      width: 13px;
      height: 10px;
      background: #002b7f;
      color: #fff;
      font-size: 8px;
      line-height: 10px;
      text-align: center;
    }

    .mini-flag.france {
      background: linear-gradient(to right, #002395 0 33%, #fff 33% 66%, #ed2939 66%);
    }

    .mini-flag.poland {
      background: linear-gradient(to bottom, #fff 0 50%, #dc143c 50%);
    }

    .mini-flag.germany {
      background: #c51f2b;
    }

    .mini-flag.germany:before {
      content: "";
      position: absolute;
      inset: 3px 8px;
      background:
        linear-gradient(to right, transparent 38%, #111 38% 62%, transparent 62%),
        linear-gradient(to bottom, transparent 36%, #111 36% 64%, transparent 64%),
        #f2f2f2;
      border-radius: 50%;
    }

    .mini-flag.japan {
      background:
        repeating-conic-gradient(from 0deg, rgba(188, 0, 45, .95) 0 8deg, transparent 8deg 18deg),
        #fff;
    }

    .mini-flag.japan:before {
      content: "";
      position: absolute;
      left: 10px;
      top: 4px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #bc002d;
    }

    .mini-flag.italy {
      background: linear-gradient(to right, #009246 0 33%, #fff 33% 66%, #ce2b37 66%);
    }

    .mini-flag.neutral {
      background: #1d8d52;
    }

    .mini-flag.neutral:before {
      content: "+";
      position: absolute;
      inset: 0;
      color: #fff;
      font-weight: 900;
      line-height: 16px;
      text-align: center;
    }

    .hud {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .topbar {
      left: clamp(12px, 2vw, 26px);
      top: clamp(10px, 2vh, 22px);
      width: min(560px, calc(100vw - 24px));
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px 14px;
      align-items: center;
    }

    .collapse-toggle {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(244, 234, 215, .18);
      border-radius: 7px;
      background: rgba(0, 0, 0, .24);
      color: #ffe4a5;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .collapse-toggle:hover {
      border-color: rgba(214, 177, 94, .65);
      background: rgba(214, 177, 94, .16);
    }

    .chevron {
      width: 10px;
      height: 10px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
      transition: transform .18s ease;
    }

    .is-collapsed .chevron {
      transform: rotate(-45deg) translateX(-2px);
    }

    .topbar.is-collapsed {
      width: min(440px, calc(100vw - 24px));
      grid-template-columns: 1fr auto;
    }

    .topbar.is-collapsed .subtitle,
    .topbar.is-collapsed .date-readout,
    .topbar.is-collapsed .legend {
      display: none;
    }

    .title {
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(20px, 3.1vw, 42px);
      line-height: 1.03;
      font-weight: 900;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .date-readout {
      min-width: 120px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(214, 177, 94, .3);
      background: rgba(214, 177, 94, .12);
      color: #ffe1a0;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .date-readout strong {
      display: block;
      font-size: 20px;
      line-height: 1.1;
    }

    .date-readout span {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: #e2c781;
    }

    .legend {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 2px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 24px;
      padding: 4px 8px;
      border: 1px solid rgba(244, 234, 215, .12);
      border-radius: 6px;
      background: rgba(0, 0, 0, .22);
      font-size: 12px;
      color: #e7dccb;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 14px currentColor;
    }

    .dot.blue { color: var(--blue); background: var(--blue); }
    .dot.red { color: var(--red); background: var(--red); }
    .dot.green { color: var(--green); background: var(--green); }

    .right-panel {
      right: clamp(10px, 2vw, 24px);
      top: clamp(10px, 2vh, 22px);
      width: min(420px, calc(100vw - 20px));
      max-height: calc(100vh - 180px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .briefing {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-strong);
    }

    .briefing-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .briefing h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.2;
    }

    .briefing p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .intel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .intel {
      min-height: 66px;
      padding: 8px;
      border: 1px solid rgba(244, 234, 215, .12);
      border-radius: 6px;
      background: rgba(0, 0, 0, .18);
    }

    .intel span {
      display: block;
      margin-bottom: 4px;
      color: #cbbf9d;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .intel b {
      display: block;
      color: #fff7e7;
      font-size: 13px;
      line-height: 1.35;
      word-break: break-word;
    }

    .event-list {
      overflow: auto;
      padding: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(214, 177, 94, .55) rgba(0, 0, 0, .2);
    }

    .right-panel.is-collapsed {
      max-height: none;
    }

    .right-panel.is-collapsed .briefing {
      border-bottom: 0;
      padding: 12px 14px;
    }

    .right-panel.is-collapsed .briefing p,
    .right-panel.is-collapsed .intel-grid,
    .right-panel.is-collapsed .event-list {
      display: none;
    }

    .right-panel.is-collapsed .briefing h2 {
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-card {
      width: 100%;
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 8px;
      margin: 0 0 7px;
      padding: 9px;
      border: 1px solid rgba(244, 234, 215, .1);
      border-radius: 7px;
      background: rgba(0, 0, 0, .18);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
      font: inherit;
    }

    .event-card:hover,
    .event-card.active {
      border-color: rgba(214, 177, 94, .62);
      background: rgba(214, 177, 94, .12);
      transform: translateX(-2px);
    }

    .event-card .when {
      color: #e8c77d;
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .event-card .what {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.3;
    }

    .event-card .who {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    .camera-dock {
      left: clamp(12px, 2vw, 26px);
      top: 205px;
      width: 70px;
      padding: 8px;
      display: grid;
      gap: 8px;
    }

    .icon-btn,
    .mode-btn,
    .speed-btn {
      min-height: 38px;
      border: 1px solid rgba(244, 234, 215, .18);
      border-radius: 7px;
      background: rgba(0, 0, 0, .24);
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
    }

    .icon-btn:hover,
    .mode-btn:hover,
    .speed-btn:hover,
    .icon-btn.active,
    .mode-btn.active,
    .speed-btn.active {
      border-color: rgba(214, 177, 94, .65);
      background: rgba(214, 177, 94, .16);
      color: #ffe4a5;
      transform: translateY(-1px);
    }

    .bottom-console {
      left: clamp(10px, 2vw, 24px);
      right: clamp(10px, 2vw, 24px);
      bottom: clamp(10px, 2vh, 20px);
      padding: 10px 12px 12px;
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .play-btn {
      width: 44px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(214, 177, 94, .54);
      border-radius: 8px;
      background: rgba(214, 177, 94, .15);
      color: #ffe4a5;
      cursor: pointer;
    }

    .play-btn .pause-icon,
    .play-btn.playing .play-icon {
      display: none;
    }

    .play-btn.playing .pause-icon {
      display: block;
    }

    .play-icon {
      width: 0;
      height: 0;
      margin-left: 3px;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 15px solid currentColor;
    }

    .pause-icon {
      width: 18px;
      height: 18px;
      background: linear-gradient(to right, currentColor 0 35%, transparent 35% 65%, currentColor 65%);
    }

    .speed-group {
      display: flex;
      gap: 6px;
    }

    .speed-btn {
      min-width: 44px;
      min-height: 34px;
      padding: 0 8px;
    }

    .timeline-wrap {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .ticks {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      color: #cabd9c;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .ticks span {
      position: relative;
      min-width: 0;
    }

    .ticks span:before {
      content: "";
      display: block;
      width: 1px;
      height: 8px;
      margin-bottom: 2px;
      background: rgba(244, 234, 215, .28);
    }

    .mode-group {
      display: flex;
      gap: 6px;
    }

    .mode-btn {
      min-width: 64px;
      padding: 0 10px;
    }

    .tactic-banner {
      left: 50%;
      top: 18%;
      transform: translateX(-50%);
      min-width: min(560px, calc(100vw - 28px));
      padding: 13px 18px;
      border-color: rgba(255, 198, 86, .55);
      background: linear-gradient(90deg, rgba(126, 33, 28, .86), rgba(26, 74, 99, .86));
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease, transform .28s ease;
    }

    .tactic-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-8px);
    }

    .tactic-banner strong {
      color: #fff2bc;
      font-size: clamp(18px, 2.4vw, 30px);
      letter-spacing: 0;
    }

    .flag-strip {
      position: absolute;
      left: 50%;
      top: clamp(10px, 2vh, 22px);
      z-index: 9;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      max-width: min(760px, 42vw);
      pointer-events: none;
    }

    .flag-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      padding: 4px 7px;
      border: 1px solid rgba(244, 234, 215, .16);
      border-radius: 6px;
      background: rgba(15, 14, 11, .72);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .24);
      color: #f3e8d6;
      font-size: 11px;
      font-weight: 800;
      backdrop-filter: blur(10px);
    }

    .status-line {
      position: absolute;
      left: 50%;
      bottom: 88px;
      z-index: 9;
      transform: translateX(-50%);
      max-width: min(720px, calc(100vw - 30px));
      padding: 7px 11px;
      border: 1px solid rgba(244, 234, 215, .14);
      border-radius: 7px;
      background: rgba(12, 12, 10, .68);
      color: #decfae;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 1080px) {
      .right-panel {
        top: auto;
        bottom: 92px;
        max-height: 38vh;
      }

      .flag-strip {
        display: none;
      }

      .camera-dock {
        top: 210px;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: 1fr auto;
        padding: 12px;
      }

      .topbar .title {
        grid-column: 1 / -1;
      }

      .date-readout {
        justify-self: start;
        min-width: 112px;
      }

      .right-panel {
        display: none;
      }

      .camera-dock {
        top: auto;
        bottom: 136px;
        width: calc(100vw - 20px);
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .bottom-console {
        grid-template-columns: auto 1fr;
        gap: 8px;
        padding: 8px;
      }

      .speed-group {
        grid-column: 1 / 2;
        grid-row: 2;
        justify-content: start;
      }

      .mode-group {
        grid-column: 2 / 3;
        grid-row: 2;
        justify-content: end;
      }

      .speed-btn {
        min-width: 39px;
        padding: 0 6px;
      }

      .mode-btn {
        min-width: 54px;
        padding: 0 8px;
      }

      .timeline-wrap {
        min-width: 0;
      }

      .status-line {
        bottom: 206px;
        font-size: 11px;
      }

      .legend {
        max-height: 58px;
        overflow: hidden;
      }

      .scene-label.map-country {
        font-size: 10px;
        padding: 2px 5px;
      }
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="theater"></canvas>
    <div id="labelLayer"></div>

    <section class="hud panel topbar" id="topbarPanel" aria-label="戰情總覽">
      <div class="title">
        <h1>第二次世界大戰 3D 戰情室</h1>
        <div class="subtitle">互動式戰略沙盤，結合地形、軍勢移動、戰力、將領、船艦與戰術特效。</div>
      </div>
      <div class="date-readout">
        <strong id="yearReadout">1939</strong>
        <span id="dateReadout">09.01</span>
      </div>
      <button class="collapse-toggle" type="button" data-collapse-target="topbarPanel" aria-label="收折戰情室標題框" aria-expanded="true">
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div class="legend">
        <span class="legend-item"><i class="dot blue"></i>藍方 同盟國</span>
        <span class="legend-item"><i class="dot red"></i>紅方 軸心國</span>
        <span class="legend-item"><i class="dot green"></i>綠色 中立</span>
      </div>
    </section>

    <div class="flag-strip" id="flagStrip" aria-label="主要軍旗"></div>

    <nav class="hud panel camera-dock" aria-label="鏡頭">
      <button class="icon-btn active" data-camera="world" title="全球">全球</button>
      <button class="icon-btn" data-camera="europe" title="歐洲">歐洲</button>
      <button class="icon-btn" data-camera="pacific" title="太平洋">太平洋</button>
      <button class="icon-btn" data-camera="africa" title="北非">北非</button>
    </nav>

    <aside class="hud panel right-panel" id="theaterPanel" aria-label="戰情事件">
      <div class="briefing">
        <div class="briefing-head">
          <div>
            <p class="eyebrow" id="theaterName">Europe Theater</p>
            <h2 id="eventTitle">德軍入侵波蘭</h2>
          </div>
          <button class="collapse-toggle" type="button" data-collapse-target="theaterPanel" aria-label="收折戰區資訊框" aria-expanded="true">
            <span class="chevron" aria-hidden="true"></span>
          </button>
        </div>

      );
      ocean.rotation.x = -Math.PI / 2;
      ocean.receiveShadow = true;
      mapGroup.add(ocean);

      const oceanGrid = new THREE.GridHelper(WORLD.width, 36, 0xb99a52, 0x35555f);

      oceanGrid.material.transparent = true;

          else shape.lineTo(p.x, p.z);

        shape.closePath();

        const geo = new THREE.ShapeGeometry(shape);
        const mesh = new THREE.Mesh(
          geo,
          new THREE.MeshStandardMaterial({
            color: land.color,
            roughness: 0.84,
            metalness: 0.04,

        mesh.castShadow = true;
        mapGroup.add(mesh);

    function initCities() {
      cities.forEach((city) => {
        const country = countries[city.country] || countries.neutral;
        const pos = geoToWorld(city.lon, city.lat, 0.45);
        const marker = new THREE.Group();
        marker.position.copy(pos);

        const mat = new THREE.MeshStandardMaterial({
          color: SIDE_COLORS[country.side],
          emissive: SIDE_COLORS[country.side],
          emissiveIntensity: 0.35,
          metalness: 0.15,
          roughness: 0.45
        });
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.2, 0.24, 18), mat);
        base.castShadow = true;
        marker.add(base);

        const halo = new THREE.Mesh(
          new THREE.TorusGeometry(0.32, 0.012, 8, 36),
          new THREE.MeshBasicMaterial({ color: SIDE_COLORS[country.side], transparent: true, opacity: 0.72 })
        );
        halo.rotation.x = Math.PI / 2;
        halo.position.y = -0.09;
        marker.add(halo);

        cityGroup.add(marker);
        addLabel(marker, `${city.name}`, "scene-label city");
      });
    }

    function initFlags() {
      const strip = document.getElementById("flagStrip");
      const order = ["usa", "uk", "ussr", "china", "france", "poland", "germany", "japan", "italy", "neutral"];
      strip.innerHTML = order.map((key) => {
        const country = countries[key];
        return `<span class="flag-chip"><i class="mini-flag ${country.flag}"></i>${country.name}</span>`;
      }).join("");
    }

    function initEvents() {
      timeSlider.max = `${events.length - 0.001}`;
      eventList.innerHTML = events.map((event, index) => {
        const year = event.date.slice(0, 4);
        const date = event.date.slice(5).replace("-", ".");
        return `
          <button class="event-card" data-index="${index}">
            <span class="when">${year}<br>${date}</span>
            <span>
              <span class="what">${event.title}</span>
              <span class="who">${event.theater}｜${event.tactic}</span>
            </span>
          </button>
        `;
      }).join("");

      eventList.querySelectorAll(".event-card").forEach((button) => {
        button.addEventListener("click", () => {
          autoplay = false;
          playBtn.classList.remove("playing");
          setMode("manual");
          setTimeline(Number(button.dataset.index), true);
        });
      });

      playBtn.addEventListener("click", () => {
        autoplay = !autoplay;
        playBtn.classList.toggle("playing", autoplay);
        setMode(autoplay ? "auto" : "manual");
      });

      timeSlider.addEventListener("input", () => {
        autoplay = false;
        playBtn.classList.remove("playing");
        setMode("manual");
        setTimeline(Number(timeSlider.value), true);
      });

      document.querySelectorAll(".speed-btn").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".speed-btn").forEach((b) => b.classList.remove("active"));
          button.classList.add("active");
          speed = Number(button.dataset.speed);
        });
      });

      document.querySelectorAll(".mode-btn").forEach((button) => {
        button.addEventListener("click", () => {
          const auto = button.dataset.mode === "auto";
          autoplay = auto;
          playBtn.classList.toggle("playing", autoplay);
          setMode(auto ? "auto" : "manual");
        });
      });

      document.querySelectorAll("[data-camera]").forEach((button) => {
        button.addEventListener("click", () => {
          setCameraPreset(button.dataset.camera, true);
          document.querySelectorAll("[data-camera]").forEach((b) => b.classList.remove("active"));
          button.classList.add("active");
        });
      });

      document.querySelectorAll("[data-collapse-target]").forEach((button) => {
        button.addEventListener("click", () => {
          const panel = document.getElementById(button.dataset.collapseTarget);
          if (!panel) return;
          const collapsed = panel.classList.toggle("is-collapsed");
          button.setAttribute("aria-expanded", `${!collapsed}`);
        });
      });

      canvas.addEventListener("pointerdown", onPointerDown);
      canvas.addEventListener("wheel", onWheel, { passive: false });
      canvas.addEventListener("pointermove", onPointerHover);
      window.addEventListener("resize", resize);
    }

    function setMode(mode) {
      document.querySelectorAll(".mode-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === mode);
      });
    }

    function setTimeline(value, forceLoad = false) {
      timeline = Math.max(0, Math.min(events.length - 0.001, value));
      const nextIndex = Math.min(events.length - 1, Math.floor(timeline));
      const progress = timeline - nextIndex;

      if (forceLoad || nextIndex !== currentIndex) {
        loadEvent(nextIndex);
      }
      updateEventProgress(progress);
      timeSlider.value = `${timeline}`;
    }

    function loadEvent(index) {
      currentIndex = index;
      const event = events[index];

      unitGroup.clear();
      effectGroup.clear();
      weatherGroup.clear();
      activeUnits = [];
      activeEffects = [];
      clearEventLabels();

      document.getElementById("theaterName").textContent = event.theater;
      document.getElementById("eventTitle").textContent = event.title;
      document.getElementById("eventSummary").textContent = event.summary;
      document.getElementById("leaders").textContent = event.leaders;
      document.getElementById("formation").textContent = event.formation;
      document.getElementById("strength").textContent = event.strength;
      document.getElementById("tactic").textContent = `${event.tactic}｜${event.weather}`;
      document.getElementById("yearReadout").textContent = event.date.slice(0, 4);
      document.getElementById("dateReadout").textContent = event.date.slice(5).replace("-", ".");
      statusLine.textContent = event.status;

      eventList.querySelectorAll(".event-card").forEach((card, cardIndex) => {
        card.classList.toggle("active", cardIndex === index);
      });

      if (autoplay) setCameraPreset(event.camera, true, event.focus);
      showTactic(event.tactic);
      createEventUnits(event);
      createWeather(event);
      createEventEffects(event);
    }

    function createEventUnits(event) {
      event.movements.forEach((move, index) => {
        const country = countries[move.country] || countries.neutral;
        const from = geoToWorld(move.from[0], move.from[1], move.type === "air" ? 3 : 0.62);
        const to = geoToWorld(move.to[0], move.to[1], move.type === "air" ? 3.2 : 0.62);
        const color = SIDE_COLORS[move.side];

        const route = createArrow(from, to, color, move.type === "air" ? 1.3 : 0.45, move.type);
        unitGroup.add(route);

        const unit = createUnitMesh(move, country);
        unit.position.copy(from);
        unitGroup.add(unit);
        activeUnits.push({ unit, from, to, move, color, pulse: Math.random() * 10 });

        const label = addLabel(
          unit,
          unitLabelHTML(country, move),
          "scene-label unit-label",
          true,
          unitLabelOffset(index, event.movements.length)
        );
        eventLabels.push(label);
        if (move.status.includes("受損") || move.status.includes("起火") || move.status.includes("被圍") || move.status.includes("孤立")) {
          addSmokeEmitter(unit);
        }
      });
    }

    function createUnitMesh(move, country) {
      const sideColor = SIDE_COLORS[move.side];
      const group = new THREE.Group();
      group.userData.clickable = true;
      group.userData.name = `${country.name} ${move.label}`;

      if (move.type === "ship") {
        createShipMiniature(group, sideColor);
        addFlagPlane(group, country.flag, 0.32, 0.54, { x: -0.42, z: -0.25 });
      } else if (move.type === "air") {
        createPlaneMiniature(group, sideColor);
        addFlagPlane(group, country.flag, 0.18, 0.36, { x: -0.46, z: -0.28 });

    function createArrow(from, to, color, lift, type) {
      const group = new THREE.Group();
      const start = from.clone();
      const end = to.clone();
      const mid = start.clone().lerp(end, 0.5);
      mid.y += lift;

      const points = [start, mid, end];
      const curve = new THREE.CatmullRomCurve3(points);
      const curvePoints = curve.getPoints(48);
      const geo = new THREE.BufferGeometry().setFromPoints(curvePoints);
      const material = new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity: type === "air" ? 0.9 : 0.76
      });
      const line = new THREE.Line(geo, material);
      group.add(line);

      for (let i = 8; i < curvePoints.length; i += 10) {
        const p = curvePoints[i];
        const next = curvePoints[Math.min(i + 1, curvePoints.length - 1)];
        const cone = new THREE.Mesh(
          new THREE.ConeGeometry(type === "air" ? 0.11 : 0.16, type === "air" ? 0.34 : 0.42, 16),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.88 })
        );
        cone.position.copy(p);
        orientAlong(cone, next.clone().sub(p));
        group.add(cone);
      }

      return group;
    }

    function createEventEffects(event) {
      const center = geoToWorld(event.focus[0], event.focus[1], 0.7);

      if (event.effects.includes("blitz")) {
        for (let i = 0; i < 3; i++) {
          const ring = new THREE.Mesh(
            new THREE.TorusGeometry(0.8 + i * 0.35, 0.018, 8, 96),
            new THREE.MeshBasicMaterial({
              color: 0xffd86b,
              transparent: true,
              opacity: 0.85 - i * 0.18
            })
          );
          ring.position.copy(center);
          ring.position.y += 0.08 + i * 0.05;
          ring.rotation.x = Math.PI / 2;
          ring.userData.effect = "ring";
          ring.userData.phase = i * 0.7;
          effectGroup.add(ring);
          activeEffects.push(ring);
        }
      }

      if (event.effects.includes("artillery")) {
        for (let i = 0; i < 12; i++) {
          const pos = center.clone();
          pos.x += (Math.random() - 0.5) * 2.1;
          pos.z += (Math.random() - 0.5) * 1.3;
          const burst = createBurst(pos, i * 0.18);
          effectGroup.add(burst);
          activeEffects.push(burst);
        }
      }

      if (event.effects.includes("smoke")) {
        for (let i = 0; i < 8; i++) {
          const p = center.clone();
          p.x += (Math.random() - 0.5) * 1.8;
          p.z += (Math.random() - 0.5) * 1.2;
          const smoke = createSmokePuff(p, Math.random() * 2);
          effectGroup.add(smoke);
          activeEffects.push(smoke);
        }
      }

      if (event.effects.includes("dust")) {
        for (let i = 0; i < 10; i++) {
          const p = center.clone();
          p.x += (Math.random() - 0.5) * 1.8;
          p.z += (Math.random() - 0.5) * 1.4;
          const dust = createDustPuff(p, Math.random() * 2);
          effectGroup.add(dust);
          activeEffects.push(dust);
        }
      }
    }

    function createWeather(event) {
      const effect = event.effects.find((item) => ["snow", "rain", "fog", "dust"].includes(item));
      if (!effect) return;

      const count = effect === "fog" ? 140 : 220;
      const positions = new Float32Array(count * 3);
      const focus = geoToWorld(event.focus[0], event.focus[1], 0);
      for (let i = 0; i < count; i++) {
        positions[i * 3 + 0] = focus.x + (Math.random() - 0.5) * 9;
        positions[i * 3 + 1] = 1 + Math.random() * (effect === "fog" ? 3.8 : 6.2);
        positions[i * 3 + 2] = focus.z + (Math.random() - 0.5) * 6.6;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: effect === "snow" ? 0xeaf7ff : effect === "rain" ? 0x85b9ff : effect === "dust" ? 0xd2a35e : 0xcfd6cf,
        size: effect === "fog" ? 0.28 : 0.12,
        transparent: true,
        opacity: effect === "fog" ? 0.28 : 0.74,
        depthWrite: false
      });
      weatherParticles = new THREE.Points(geo, mat);
      weatherParticles.userData.effect = effect;
      weatherParticles.userData.focus = focus;
      weatherGroup.add(weatherParticles);
    }

    function createSmokePuff(pos, phase) {
      const group = new THREE.Group();

      const mat = new THREE.MeshBasicMaterial({

    function createDustPuff(pos, phase) {
      const group = createSmokePuff(pos, phase);
      group.userData.effect = "dust";
      group.children.forEach((child) => {
        child.material.color.set(0xc29a57);
        child.material.opacity = 0.23;
      });

    function addSmokeEmitter(object) {
      const smoke = createSmokePuff(new THREE.Vector3(0, 0.42, 0), Math.random() * 2);
      smoke.scale.setScalar(0.7);
      object.add(smoke);
      activeEffects.push(smoke);
    }

    function updateEventProgress(progress) {
      const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;

      activeUnits.forEach((item, index) => {
        const local = Math.min(1, Math.max(0, ease + index * 0.035));
        item.unit.position.copy(item.from.clone().lerp(item.to, local));
        item.unit.position.y += Math.sin(performance.now() * 0.002 + item.pulse) * 0.035;
        const dir = item.to.clone().sub(item.from);
        if (dir.lengthSq() > 0.001) {
          item.unit.rotation.y = Math.atan2(dir.x, dir.z) + Math.PI / 2;
        }
      });
    }

    function updateEffects(dt, now) {
      activeEffects.forEach((effect) => {
        const type = effect.userData.effect;
        if (type === "ring") {
          const t = (now * 0.001 + effect.userData.phase) % 2.2;
          const s = 0.8 + t * 1.15;
          effect.scale.setScalar(s);
          effect.material.opacity = Math.max(0, 0.78 - t * 0.34);
        } else if (type === "burst") {
          const age = ((now * 0.001) - effect.userData.delay) % 2.4;
          const active = age > 0 && age < 1.4;
          effect.visible = active;
          if (active) {
            const s = 0.4 + age * 1.9;
            effect.scale.setScalar(s);
            effect.children.forEach((child, i) => {
              child.material.opacity = Math.max(0, (i ? 0.38 : 0.95) - age * 0.48);
            });
          }
        } else if (type === "smoke" || type === "dust") {
          effect.children.forEach((child, index) => {
            child.position.y += dt * (0.08 + index * 0.02);
            child.scale.multiplyScalar(1 + dt * 0.02);
            if (child.position.y > 1.8) child.position.y = Math.random() * 0.2;
          });
        }
      });

      if (weatherParticles) {
        const effect = weatherParticles.userData.effect;
        const attr = weatherParticles.geometry.getAttribute("position");
        const focus = weatherParticles.userData.focus;
        for (let i = 0; i < attr.count; i++) {
          let y = attr.getY(i);
          let x = attr.getX(i);
          let z = attr.getZ(i);
          if (effect === "snow") {
            y -= dt * 1.5;
            x += Math.sin(now * 0.001 + i) * dt * 0.2;
          } else if (effect === "rain") {
            y -= dt * 4.4;
            x += dt * 0.5;
          } else if (effect === "dust") {
            y += dt * 0.35;
            x += dt * 0.9;
          } else {
            x += Math.sin(now * 0.0007 + i) * dt * 0.24;
            z += Math.cos(now * 0.0009 + i) * dt * 0.2;
          }
          if (y < 0.25 || y > 6.6 || Math.abs(x - focus.x) > 6) {
            y = 1 + Math.random() * 5.5;
            x = focus.x + (Math.random() - 0.5) * 9;
            z = focus.z + (Math.random() - 0.5) * 6.6;
          }
          attr.setXYZ(i, x, y, z);
        }
        attr.needsUpdate = true;
      }

      if (bannerTimer > 0) {
        bannerTimer -= dt;
        if (bannerTimer <= 0) tacticBanner.classList.remove("show");
      }
    }

    function showTactic(tactic) {
      tacticText.textContent = `計策發動：${tactic}`;
      tacticBanner.classList.add("show");

    function initPointerState() {
      return {
        dragging: false,
        x: 0,
        y: 0,
        theta: 0,
        phi: 0
      };
    }

    const pointerState = initPointerState();

    function onPointerDown(event) {
      pointerState.dragging = true;
      pointerState.x = event.clientX;
      pointerState.y = event.clientY;
      pointerState.theta = cameraRig.theta;
      pointerState.phi = cameraRig.phi;
      canvas.setPointerCapture(event.pointerId);
      canvas.addEventListener("pointermove", onPointerDrag);
      canvas.addEventListener("pointerup", onPointerUp, { once: true });
      canvas.addEventListener("pointercancel", onPointerUp, { once: true });
    }

    function onPointerDrag(event) {
      if (!pointerState.dragging) return;
      const dx = event.clientX - pointerState.x;
      const dy = event.clientY - pointerState.y;
      cameraRig.theta = pointerState.theta - dx * 0.006;
      cameraRig.phi = clamp(pointerState.phi + dy * 0.004, 0.34, 1.42);
      cameraRig.desired = null;
    }

    function onPointerUp(event) {
      pointerState.dragging = false;
      try {
        canvas.releasePointerCapture(event.pointerId);
      } catch (_) {}
      canvas.removeEventListener("pointermove", onPointerDrag);
    }

    function onWheel(event) {
      event.preventDefault();
      cameraRig.radius = clamp(cameraRig.radius + event.deltaY * 0.035, 11, 96);
      cameraRig.desired = null;
    }

    function onPointerHover(event) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
    }

    function setCameraPreset(preset, animated = true, focusOverride = null) {
      const presets = {
        world: { target: [0, 0, 0], radius: 58, theta: -0.82, phi: 0.88 },
        europe: { target: geoToWorld(18, 49, 0), radius: 16, theta: -0.88, phi: 0.76 },
        pacific: { target: geoToWorld(-175, 28, 0), radius: 23, theta: -1.1, phi: 0.8 },
        africa: { target: geoToWorld(18, 26, 0), radius: 17, theta: -0.68, phi: 0.8 }
      };
      const chosen = { ...(presets[preset] || presets.world) };
      if (focusOverride) chosen.target = geoToWorld(focusOverride[0], focusOverride[1], 0);
      if (Array.isArray(chosen.target)) chosen.target = new THREE.Vector3(...chosen.target);

      if (!animated) {
        cameraRig.target.copy(chosen.target);
        cameraRig.radius = chosen.radius;
        cameraRig.theta = chosen.theta;
        cameraRig.phi = chosen.phi;
        cameraRig.desired = null;
        updateCamera(1);
      } else {
        cameraRig.desired = chosen;
      }
    }

    function updateCamera(dt) {
      if (cameraRig.desired) {
        const t = 1 - Math.pow(0.001, dt);
        cameraRig.target.lerp(cameraRig.desired.target, t);
        cameraRig.radius += (cameraRig.desired.radius - cameraRig.radius) * t;
        cameraRig.theta += shortestAngle(cameraRig.theta, cameraRig.desired.theta) * t;
        cameraRig.phi += (cameraRig.desired.phi - cameraRig.phi) * t;
        if (
          cameraRig.target.distanceTo(cameraRig.desired.target) < 0.02 &&
          Math.abs(cameraRig.radius - cameraRig.desired.radius) < 0.02
        ) {
          cameraRig.desired = null;
        }
      }

      const sinPhi = Math.sin(cameraRig.phi);
      const x = cameraRig.target.x + cameraRig.radius * sinPhi * Math.sin(cameraRig.theta);
      const y = cameraRig.target.y + cameraRig.radius * Math.cos(cameraRig.phi);
      const z = cameraRig.target.z + cameraRig.radius * sinPhi * Math.cos(cameraRig.theta);
      camera.position.set(x, y, z);
      camera.lookAt(cameraRig.target);
    }

    function updateLabels() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      labels.forEach((item) => {
        if (!item.object.parent && !item.object.isScene) {
          item.el.style.display = "none";
          return;
        }
        item.object.updateWorldMatrix(true, false);
        tempVec.setFromMatrixPosition(item.object.matrixWorld);
        tempVec.project(camera);
        const visible = tempVec.z > -1 && tempVec.z < 1;
        if (!visible) {
          item.el.style.opacity = 0;
          return;
        }
        const x = (tempVec.x * 0.5 + 0.5) * width + (item.offset?.x || 0);
        const y = (-tempVec.y * 0.5 + 0.5) * height + (item.offset?.y || 0);
        item.el.style.opacity = item.eventLabel ? 1 : 0.82;
        item.el.style.transform = `translate(-50%, -100%) translate(${x}px, ${y}px)`;
      });
    }

    function unitLabelOffset(index, total) {
      const spread = total <= 2 ? 48 : 68;
      const row = index % 2 === 0 ? -1 : 1;
      const center = (total - 1) / 2;
      return {
        x: (index - center) * spread,
        y: row * 26
      };
    }

    function addLabel(object, html, className, eventLabel = false, offset = { x: 0, y: 0 }) {
      const el = document.createElement("div");
      el.className = className;
      el.innerHTML = html;
      labelLayer.appendChild(el);
      const item = { object, el, eventLabel, offset };
      labels.push(item);
      return item;
    }

    function clearEventLabels() {
      labels.slice().forEach((item) => {
        if (item.eventLabel) {
          item.el.remove();
          const index = labels.indexOf(item);
          if (index >= 0) labels.splice(index, 1);
        }
      });
      eventLabels = [];
    }

    function geoToWorld(lon, lat, y = 0) {
      let wrappedLon = lon;
      if (wrappedLon > 180) wrappedLon -= 360;
      if (wrappedLon < -180) wrappedLon += 360;
      return new THREE.Vector3(
        (wrappedLon / 180) * (WORLD.width / 2),
        y,
        -(lat / 90) * (WORLD.height / 2)
      );
    }

    function makePolyline(points, color, opacity, y = 0.12) {
      const positions = points.map(([lon, lat]) => {
        const p = geoToWorld(lon, lat, y);
        return p;
      });
      positions.push(positions[0].clone());
      const geo = new THREE.BufferGeometry().setFromPoints(positions);
      return new THREE.Line(
        geo,
        new THREE.LineBasicMaterial({ color, transparent: true, opacity })
      );
    }

    function addPoliticalMapOverlay() {
      const texture = createPoliticalMapTexture();
      const overlay = new THREE.Mesh(
        new THREE.PlaneGeometry(WORLD.width, WORLD.height),
        new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          opacity: 0.94,
          depthWrite: false
        })
      );
      overlay.rotation.x = -Math.PI / 2;
      overlay.position.y = 0.215;
      overlay.renderOrder = 2;
      mapGroup.add(overlay);
    }

    function createPoliticalMapTexture() {
      const canvasMap = document.createElement("canvas");
      canvasMap.width = 2400;
      canvasMap.height = 1200;
      const ctx = canvasMap.getContext("2d");
      ctx.clearRect(0, 0, canvasMap.width, canvasMap.height);

      drawMapGrid(ctx, canvasMap.width, canvasMap.height);

      landMasses.forEach((land) => {
        drawMapPolygon(ctx, land.points, {
          width: canvasMap.width,
          height: canvasMap.height,
          fill: "rgba(134, 152, 101, .28)",
          stroke: "rgba(226, 202, 132, .42)",
          lineWidth: 3
        });
      });

      mapCountryAreas.forEach((area) => {
        drawMapPolygon(ctx, area.points, {
          width: canvasMap.width,
          height: canvasMap.height,
          fill: mapSideFill(area.side, .34),
          stroke: mapSideStroke(area.side, .82),
          lineWidth: 4
        });
      });

      mapCountryAreas
        .filter((area) => shouldDrawMapText(area))
        .forEach((area) => {
        const [x, y] = mapProject(area.label[0], area.label[1], canvasMap.width, canvasMap.height);
        ctx.save();
        ctx.font = "900 22px 'Microsoft JhengHei', 'Noto Sans TC', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineWidth = 6;
        ctx.strokeStyle = "rgba(6, 8, 8, .82)";
        ctx.fillStyle = mapSideText(area.side);
        ctx.strokeText(area.name, x, y);
        ctx.fillText(area.name, x, y);
        ctx.restore();
      });

      const texture = new THREE.CanvasTexture(canvasMap);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 8;
      texture.needsUpdate = true;
      return texture;
    }

    function shouldDrawMapText(area) {
      return ["加拿大", "美國", "巴西", "北非英軍區", "蘇聯", "印度", "中國", "日本", "澳洲"].includes(area.name);
    }

    function drawMapGrid(ctx, width, height) {
      ctx.save();
      ctx.strokeStyle = "rgba(220, 198, 132, .18)";
      ctx.lineWidth = 1.6;
      ctx.setLineDash([9, 12]);
      for (let lon = -150; lon <= 150; lon += 30) {
        const [x] = mapProject(lon, 0, width, height);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let lat = -60; lat <= 60; lat += 30) {
        const [, y] = mapProject(0, lat, width, height);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawMapPolygon(ctx, points, options) {
      ctx.save();
      ctx.beginPath();
      points.forEach(([lon, lat], index) => {
        const [x, y] = mapProject(lon, lat, options.width, options.height);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fillStyle = options.fill;
      ctx.fill();
      ctx.strokeStyle = options.stroke;
      ctx.lineWidth = options.lineWidth;
      ctx.lineJoin = "round";
      ctx.stroke();
      ctx.restore();
    }

    function mapProject(lon, lat, width, height) {
      let wrappedLon = lon;
      if (wrappedLon > 180) wrappedLon -= 360;
      if (wrappedLon < -180) wrappedLon += 360;
      return [
        ((wrappedLon + 180) / 360) * width,
        ((90 - lat) / 180) * height
      ];
    }

    function mapSideFill(side, alpha) {
      if (side === "axis") return `rgba(255, 78, 66, ${alpha})`;
      if (side === "neutral") return `rgba(88, 212, 123, ${alpha})`;
      return `rgba(60, 167, 255, ${alpha})`;
    }

    function mapSideStroke(side, alpha) {
      if (side === "axis") return `rgba(255, 106, 95, ${alpha})`;
      if (side === "neutral") return `rgba(117, 235, 148, ${alpha})`;
      return `rgba(99, 190, 255, ${alpha})`;
    }

    function mapSideText(side) {
      if (side === "axis") return "#ffd0cb";
      if (side === "neutral") return "#ccffd8";
      return "#caebff";
    }

    function addMapCountryLabels() {
      mapCountryLabels.forEach((label) => {
        const obj = new THREE.Object3D();
        obj.position.copy(geoToWorld(label.lon, label.lat, 0.72));
        mapGroup.add(obj);
        addLabel(obj, label.name, `scene-label map-country ${label.side}`);
      });
    }

    function addMountainRange(name, points, scale = 1, color = 0x7c704f) {
      points.forEach(([lon, lat], index) => {
        const pos = geoToWorld(lon, lat, 0.14);
        const peak = new THREE.Mesh(
          new THREE.ConeGeometry(0.42 * scale, 1.15 * scale, 4),
          new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0.04 })
        );
        peak.position.copy(pos);
        peak.position.y += 0.46 * scale;
        peak.rotation.y = index * 0.7;
        peak.castShadow = true;
        peak.receiveShadow = true;
        mapGroup.add(peak);
      });
      const labelObj = new THREE.Object3D();
      labelObj.position.copy(geoToWorld(points[Math.floor(points.length / 2)][0], points[Math.floor(points.length / 2)][1], 1.3 * scale));
      mapGroup.add(labelObj);
      addLabel(labelObj, name, "scene-label city");
    }

    function addNeutralZone(name, lon, lat) {
      const pos = geoToWorld(lon, lat, 0.28);
      const marker = new THREE.Mesh(
        new THREE.CylinderGeometry(0.28, 0.28, 0.08, 30),
        new THREE.MeshBasicMaterial({ color: SIDE_COLORS.neutral, transparent: true, opacity: 0.55 })
      );
      marker.position.copy(pos);
      mapGroup.add(marker);
      addLabel(marker, name, "scene-label city");
    }

    function orientAlong(object, direction) {
      if (direction.lengthSq() < 0.0001) return;
      direction.normalize();
      object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
    }

    function makeFlagTexture(flag) {
      const c = document.createElement("canvas");
      c.width = 160;
      c.height = 96;
      const ctx = c.getContext("2d");
      drawFlag(ctx, flag, 160, 96);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    function drawFlag(ctx, flag, w, h) {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#777";
      ctx.fillRect(0, 0, w, h);

      if (flag === "usa") {
        for (let i = 0; i < 13; i++) {
          ctx.fillStyle = i % 2 ? "#fff" : "#b22234";
          ctx.fillRect(0, i * h / 13, w, h / 13);
        }
        ctx.fillStyle = "#23406f";
        ctx.fillRect(0, 0, w * 0.42, h * 0.54);
        ctx.fillStyle = "#fff";
        for (let y = 0; y < 5; y++) {
          for (let x = 0; x < 6; x++) {
            ctx.beginPath();
            ctx.arc(9 + x * 9, 8 + y * 8, 1.4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      } else if (flag === "uk") {
        ctx.fillStyle = "#012169";
        ctx.fillRect(0, 0, w, h);
        drawBand(ctx, 0, 0, w, h, "#fff", 16);
        drawBand(ctx, 0, h, w, 0, "#fff", 16);
        drawBand(ctx, 0, 0, w, h, "#c8102e", 7);
        drawBand(ctx, 0, h, w, 0, "#c8102e", 7);
        ctx.fillStyle = "#fff";
        ctx.fillRect(w * 0.42, 0, w * 0.16, h);
        ctx.fillRect(0, h * 0.39, w, h * 0.22);
        ctx.fillStyle = "#c8102e";
        ctx.fillRect(w * 0.46, 0, w * 0.08, h);
        ctx.fillRect(0, h * 0.44, w, h * 0.12);
      } else if (flag === "ussr") {
        ctx.fillStyle = "#c81925";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#ffd23f";
        drawStar(ctx, 28, 22, 14, 6, 5);
        ctx.font = "bold 20px sans-serif";
        ctx.fillText("CCCP", 52, 30);
      } else if (flag === "china") {
        ctx.fillStyle = "#de2910";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#002b7f";
        ctx.fillRect(0, 0, w * 0.46, h * 0.55);
        ctx.fillStyle = "#fff";
        drawStar(ctx, 36, 25, 16, 5, 12);
      } else if (flag === "france") {
        ctx.fillStyle = "#002395";
        ctx.fillRect(0, 0, w / 3, h);
        ctx.fillStyle = "#fff";
        ctx.fillRect(w / 3, 0, w / 3, h);
        ctx.fillStyle = "#ed2939";
        ctx.fillRect(w * 2 / 3, 0, w / 3, h);
      } else if (flag === "poland") {
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h / 2);
        ctx.fillStyle = "#dc143c";
        ctx.fillRect(0, h / 2, w, h / 2);
      } else if (flag === "germany") {
        ctx.fillStyle = "#c51f2b";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(w * 0.5, h * 0.5, h * 0.32, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#111";
        ctx.fillRect(w * 0.46, h * 0.22, w * 0.08, h * 0.56);
        ctx.fillRect(w * 0.32, h * 0.43, w * 0.36, h * 0.14);
      } else if (flag === "japan") {
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "rgba(188, 0, 45, .9)";
        for (let i = 0; i < 16; i++) {
          ctx.save();
          ctx.translate(w * 0.5, h * 0.5);
          ctx.rotate((Math.PI * 2 / 16) * i);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(w * 0.62, -3);
          ctx.lineTo(w * 0.62, 3);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = "#bc002d";
        ctx.beginPath();
        ctx.arc(w * 0.5, h * 0.5, h * 0.23, 0, Math.PI * 2);
        ctx.fill();
      } else if (flag === "italy") {
        ctx.fillStyle = "#009246";
        ctx.fillRect(0, 0, w / 3, h);
        ctx.fillStyle = "#fff";
        ctx.fillRect(w / 3, 0, w / 3, h);
        ctx.fillStyle = "#ce2b37";
        ctx.fillRect(w * 2 / 3, 0, w / 3, h);
      } else {
        ctx.fillStyle = "#1d8d52";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#fff";
        ctx.fillRect(w * 0.43, h * 0.18, w * 0.14, h * 0.64);
        ctx.fillRect(w * 0.25, h * 0.42, w * 0.5, h * 0.16);
      }

      ctx.strokeStyle = "rgba(0,0,0,.45)";
      ctx.lineWidth = 4;
      ctx.strokeRect(1, 1, w - 2, h - 2);
    }

    function drawBand(ctx, x1, y1, x2, y2, color, width) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawStar(ctx, cx, cy, outer, inner, points) {
      ctx.beginPath();
      for (let i = 0; i < points * 2; i++) {
        const r = i % 2 === 0 ? outer : inner;
        const a = -Math.PI / 2 + i * Math.PI / points;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function animate(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000 || 0.016);
      lastFrame = now;

      if (autoplay) {
        let next = timeline + dt * speed;
        if (next >= events.length - 0.001) next = 0;
        setTimeline(next);
      }

      const progress = timeline - Math.floor(timeline);
      updateEventProgress(progress);
      updateEffects(dt, now);
      updateCamera(dt);
      updateLabels();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function shortestAngle(current, target) {
      return Math.atan2(Math.sin(target - current), Math.cos(target - current));
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }
  </script>
